name: CI

'on':
  push:
    branches: [main]
    paths:
      - 'packages/eslint-formatter-crisp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/eslint-formatter-crisp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: packages/eslint-formatter-crisp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/eslint-formatter-crisp

      - name: Lint & format check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          npm run lint --if-present
        working-directory: packages/eslint-formatter-crisp

  test-node:
    name: Node tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: packages/eslint-formatter-crisp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/eslint-formatter-crisp

      - name: Build native addon
        run: npm run build
        working-directory: packages/eslint-formatter-crisp

      - name: Typecheck & smoke
        run: |
          npm run typecheck
          npm run smoke
        working-directory: packages/eslint-formatter-crisp

      - name: Run Node tests
        run: npm run test:node
        working-directory: packages/eslint-formatter-crisp

  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: packages/eslint-formatter-crisp
