name: Package release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run Semantic Release dry-run
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Release validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: packages/eslint-formatter-crisp/package-lock.json

      - name: Install dependencies & Validate
        run: |
          npm ci --no-audit --no-fund --force
          npm test
        working-directory: packages/eslint-formatter-crisp

  release:
    name: Semantic Release
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --force
        working-directory: packages/eslint-formatter-crisp

      - name: Run Semantic Release (Dry-Run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        working-directory: packages/eslint-formatter-crisp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --extends "./release.config.js" --dry-run

      - name: Run Semantic Release (Publish)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        working-directory: packages/eslint-formatter-crisp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --extends "./release.config.js"
