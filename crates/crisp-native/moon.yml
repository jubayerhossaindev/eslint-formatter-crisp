$schema: 'https://moonrepo.dev/schemas/project.json'

language: rust
layer: library

project:
  description: N-API binding for crisp-core, distributed as the crisp .node addon.

tasks:
  build:
    command: cargo build
    toolchains: [rust]
    options:
      cache: false

  check:
    command: cargo check
    toolchains: [rust]
    options:
      cache: false

  lint:
    command: cargo clippy --all-targets --all-features -D warnings
    toolchains: [rust]
    options:
      cache: false

  test:
    command: cargo test
    toolchains: [rust]
    options:
      cache: false

  fmt:
    command: cargo fmt --all -- --check
    toolchains: [rust]
    options:
      cache: false
