# ============================================================
# ESLint Formatter Crisp — Taplo Configuration
# ============================================================

# ------------------------------------------------------------
# File Selection
# ------------------------------------------------------------

include = ["**/*.toml"]

exclude = [".git/**", "**/.git/**", "**/node_modules/**", "**/target/**", "**/.moon/cache/**"]

# ------------------------------------------------------------
# Global Formatting
# ------------------------------------------------------------

[formatting]

# Alignment
align_entries = false
align_comments = false

# Arrays
array_auto_collapse = true
array_auto_expand = true
array_trailing_comma = true
compact_arrays = true

# Inline tables and entries
compact_entries = false
compact_inline_tables = false
inline_table_expand = true

# Width and whitespace
column_width = 100
allowed_blank_lines = 2
indent_string = "  "
indent_entries = false
indent_tables = false

# Line endings
crlf = false
trailing_newline = true

# Ordering
reorder_arrays = false
reorder_inline_tables = false
reorder_keys = false


# ============================================================
# Cargo.toml — JSON Schema Validation
# ============================================================

[[rule]]
include = ["**/Cargo.toml"]

[rule.schema]
path = "https://json.schemastore.org/cargo.json"
enabled = true


# ============================================================
# Cargo.toml — Dependency Sorting
# ============================================================

[[rule]]
include = ["**/Cargo.toml"]

keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "workspace.dependencies",
  "target.*.dependencies",
  "target.*.dev-dependencies",
  "target.*.build-dependencies",
]

[rule.formatting]
reorder_keys = true
