# ============================
# Taplo Global Configuration
# ============================

include = ["**/*.toml"]
exclude = [".git/**", "node_modules/**", "target/**"]

# ============================
# Formatting (Safe defaults)
# ============================
[formatting]
  align_entries = false
  align_comments = false
  allowed_blank_lines = 2
  array_auto_collapse = true
  array_auto_expand = true
  array_trailing_comma = true
  column_width = 100
  compact_arrays = true
  compact_entries = false
  compact_inline_tables = false
  crlf = false
  indent_entries = true
  indent_tables = true
  indent_string = "  "
  inline_table_expand = true
  reorder_arrays = false
  reorder_inline_tables = false
  reorder_keys = false
  trailing_newline = true

# ============================
# RULE: Cargo.toml (Schema + Lint + Sort deps)
# ============================
[[rule]]
  include = ["**/Cargo.toml"]
  keys = ["dependencies"]

  # 🔥 This is the CORRECT place for schema
  [rule.schema]
    path = "https://json.schemastore.org/cargo.json"
    enabled = true

  [rule.formatting]
    reorder_keys = true


