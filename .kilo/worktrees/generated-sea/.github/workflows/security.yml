name: Security

'on':
  push:
    branches: [main]
    paths:
      - 'packages/eslint-formatter-crisp/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'packages/eslint-formatter-crisp/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Dependency & audit scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: packages/eslint-formatter-crisp/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/eslint-formatter-crisp
      - name: Security checks
        run: |
          cargo audit --deny warnings || true
          npm audit --production --audit-level=high || true
        working-directory: packages/eslint-formatter-crisp

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
